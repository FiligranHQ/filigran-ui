name: Release and Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      package:
        description: 'Package to release'
        required: true
        default: '@filigran/ui'
        type: choice
        options:
          - '@filigran/chatbot'
          - '@filigran/icon'
          - '@filigran/rich-text-editor'
          - '@filigran/ui'
          - all

env:
  ORGANIZATION: 'FiligranHQ'
  PROJECT_NUMBER: 30

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.FILIGRANHQ_PROJECT_APP_ID }}
          private-key: ${{ secrets.FILIGRANHQ_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable Corepack
        run: npm install -g corepack
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Get current versions
        run: |
          if [[ "${{ github.event.inputs.package }}" == "@filigran/chatbot" ]] || [[ "${{ github.event.inputs.package }}" == "all" ]]; then
            echo "FILIGRAN_CHATBOT_CURRENT_VERSION=$(node -p "require('./packages/filigran-chatbot/package.json').version")" >> $GITHUB_ENV
          fi
          if [[ "${{ github.event.inputs.package }}" == "@filigran/icon" ]] || [[ "${{ github.event.inputs.package }}" == "all" ]]; then
            echo "FILIGRAN_ICON_CURRENT_VERSION=$(node -p "require('./packages/filigran-icon/package.json').version")" >> $GITHUB_ENV
          fi
          if [[ "${{ github.event.inputs.package }}" == "@filigran/rich-text-editor" ]] || [[ "${{ github.event.inputs.package }}" == "all" ]]; then
            echo "FILIGRAN_RTE_CURRENT_VERSION=$(node -p "require('./packages/filigran-rich-text-editor/package.json').version")" >> $GITHUB_ENV
          fi
          if [[ "${{ github.event.inputs.package }}" == "@filigran/ui" ]] || [[ "${{ github.event.inputs.package }}" == "all" ]]; then
            echo "FILIGRAN_UI_CURRENT_VERSION=$(node -p "require('./packages/filigran-ui/package.json').version")" >> $GITHUB_ENV
          fi
      - name: Update version for @filigran/chatbot
        if: github.event.inputs.package == '@filigran/chatbot' || github.event.inputs.package == 'all'
        working-directory: ./packages/filigran-chatbot
        run: |
          yarn version ${{ github.event.inputs.version_type }}
          echo "FILIGRAN_CHATBOT_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Update version for @filigran/icon
        if: github.event.inputs.package == '@filigran/icon' || github.event.inputs.package == 'all'
        working-directory: ./packages/filigran-icon
        run: |
          yarn version ${{ github.event.inputs.version_type }}
          echo "FILIGRAN_ICON_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Update version for @filigran/rich-text-editor
        if: github.event.inputs.package == '@filigran/rich-text-editor' || github.event.inputs.package == 'all'
        working-directory: ./packages/filigran-rich-text-editor
        run: |
          yarn version ${{ github.event.inputs.version_type }}
          echo "FILIGRAN_RTE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Update version for @filigran/ui
        if: github.event.inputs.package == '@filigran/ui' || github.event.inputs.package == 'all'
        working-directory: ./packages/filigran-ui
        run: |
          yarn version ${{ github.event.inputs.version_type }}
          echo "FILIGRAN_UI_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Collect commits and issues for changelog
        id: changelog
        run: |
          # Initialize variables
          CHANGELOG=""
          UI_ISSUES=""
          ICON_ISSUES=""
          
          # Function to extract issue numbers from text
          extract_issues() {
            echo "$1" | grep -oE '#[0-9]+|[Cc]loses? #[0-9]+|[Ff]ixes? #[0-9]+|[Rr]esolves? #[0-9]+' | grep -oE '[0-9]+' | sort -u
          }
          
          # Get commits since last tag for each package
          if [ -n "$FILIGRAN_UI_VERSION" ]; then
            echo "Processing @filigran/ui commits..."
            LAST_UI_TAG=$(git tag -l "@filigran/ui-v*" | sort -V | tail -n 1)
            if [ -z "$LAST_UI_TAG" ]; then
              LAST_UI_TAG=$(git rev-list --max-parents=0 HEAD)
            fi
          
            UI_COMMITS=$(git log $LAST_UI_TAG..HEAD --pretty=format:"%h %s" -- packages/filigran-ui/)
            UI_CHANGELOG="### Filigran UI Changes\n"
          
            while IFS= read -r commit; do
              if [ -n "$commit" ]; then
                UI_CHANGELOG="$UI_CHANGELOG- $commit\n"
                ISSUES=$(extract_issues "$commit")
                for issue in $ISSUES; do
                  UI_ISSUES="$UI_ISSUES $issue"
                done
              fi
            done <<< "$UI_COMMITS"
          
            CHANGELOG="$CHANGELOG$UI_CHANGELOG\n"
          
            # Remove duplicates from UI issues list
            UI_ISSUES=$(echo $UI_ISSUES | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          
          if [ -n "$FILIGRAN_ICON_VERSION" ]; then
            echo "Processing @filigran/icon commits..."
            LAST_ICON_TAG=$(git tag -l "@filigran/icon-v*" | sort -V | tail -n 1)
            if [ -z "$LAST_ICON_TAG" ]; then
              LAST_ICON_TAG=$(git rev-list --max-parents=0 HEAD)
            fi
          
            ICON_COMMITS=$(git log $LAST_ICON_TAG..HEAD --pretty=format:"%h %s" -- packages/filigran-icon/)
            ICON_CHANGELOG="### Filigran Icon Changes\n"
          
            while IFS= read -r commit; do
              if [ -n "$commit" ]; then
                ICON_CHANGELOG="$ICON_CHANGELOG- $commit\n"
                ISSUES=$(extract_issues "$commit")
                for issue in $ISSUES; do
                  ICON_ISSUES="$ICON_ISSUES $issue"
                done
              fi
            done <<< "$ICON_COMMITS"
          
            CHANGELOG="$CHANGELOG$ICON_CHANGELOG\n"
          
            # Remove duplicates from ICON issues list
            ICON_ISSUES=$(echo $ICON_ISSUES | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          
          # Export for use in next steps
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "ui_issues=$UI_ISSUES" >> $GITHUB_OUTPUT
          echo "icon_issues=$ICON_ISSUES" >> $GITHUB_OUTPUT
          
          # Also save to environment for debugging
          echo "UI_ISSUES_TO_CLOSE=$UI_ISSUES" >> $GITHUB_ENV
          echo "ICON_ISSUES_TO_CLOSE=$ICON_ISSUES" >> $GITHUB_ENV
      - name: Commit version changes
        id: commit
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // A release commits the bump to the branch it was dispatched from, so a tag or
            // any other ref cannot work. Refuse it here rather than letting updateRef fail
            // on a nonsensical `heads/refs/tags/...`.
            const branchPrefix = 'refs/heads/';
            if (!context.ref.startsWith(branchPrefix)) {
              throw new Error(`This workflow must be dispatched from a branch, but got ${context.ref}.`);
            }
            const branch = context.ref.slice(branchPrefix.length);

            const packages = [
              { label: '@filigran/chatbot', version: process.env.FILIGRAN_CHATBOT_VERSION },
              { label: '@filigran/ui', version: process.env.FILIGRAN_UI_VERSION },
              { label: '@filigran/icon', version: process.env.FILIGRAN_ICON_VERSION },
              { label: '@filigran/rich-text-editor', version: process.env.FILIGRAN_RTE_VERSION },
            ].filter((pkg) => pkg.version);

            if (packages.length === 0) {
              console.log('No version changes to commit');
              core.setOutput('committed', 'false');
              return;
            }

            const git = (command) => execSync(command, { encoding: 'utf8' }).split('\n').filter(Boolean);

            // `yarn version` touches more than the bumped package.json: it also realigns
            // dependent workspaces' ranges and yarn.lock. Collect whatever actually changed
            // rather than assuming, so the commit stays self-consistent.
            const changed = [...new Set([
              ...git('git diff --name-only HEAD'),
              ...git('git ls-files --others --exclude-standard'),
            ])];

            if (changed.length === 0) {
              console.log('Versions bumped but working tree is clean; nothing to commit');
              core.setOutput('committed', 'false');
              return;
            }

            console.log(`Changed files:\n${changed.map((path) => `  ${path}`).join('\n')}`);

            const parent = process.env.GITHUB_SHA;
            const message = `chore: bump ${packages.map((pkg) => `${pkg.label} to v${pkg.version}`).join(', ')}`;

            // The default branch requires verified signatures, which a commit made on the
            // runner cannot carry. Commits created through the API are signed by GitHub.
            const parentCommit = await github.rest.git.getCommit({
              ...context.repo,
              commit_sha: parent,
            });

            const entries = [];
            for (const path of changed) {
              if (!fs.existsSync(path)) {
                entries.push({ path, mode: '100644', type: 'blob', sha: null });
                continue;
              }
              const blob = await github.rest.git.createBlob({
                ...context.repo,
                content: fs.readFileSync(path).toString('base64'),
                encoding: 'base64',
              });
              const executable = (fs.statSync(path).mode & 0o111) !== 0;
              entries.push({ path, mode: executable ? '100755' : '100644', type: 'blob', sha: blob.data.sha });
            }

            const tree = await github.rest.git.createTree({
              ...context.repo,
              base_tree: parentCommit.data.tree.sha,
              tree: entries,
            });

            const commit = await github.rest.git.createCommit({
              ...context.repo,
              message,
              tree: tree.data.sha,
              parents: [parent],
            });

            // Not forced: if the branch moved since the run was dispatched, this fails
            // rather than discarding whatever landed in between.
            await github.rest.git.updateRef({
              ...context.repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
            });

            console.log(`Created ${commit.data.sha}: ${message}`);
            core.setOutput('committed', 'true');
            core.setOutput('sha', commit.data.sha);
      - name: Sync checkout to the signed commit
        if: steps.commit.outputs.committed == 'true'
        run: |
          git fetch origin
          git reset --hard ${{ steps.commit.outputs.sha }}
      - name: Create Git tags
        run: |
          if [ -n "$FILIGRAN_CHATBOT_VERSION" ]; then
            git tag "@filigran/chatbot-$FILIGRAN_CHATBOT_VERSION"
            echo "Created tag: @filigran/chatbot-$FILIGRAN_CHATBOT_VERSION"
          fi
          if [ -n "$FILIGRAN_ICON_VERSION" ]; then
            git tag "@filigran/icon-v$FILIGRAN_ICON_VERSION"
            echo "Created tag: @filigran/icon-v$FILIGRAN_ICON_VERSION"
          fi
          if [ -n "$FILIGRAN_RTE_VERSION" ]; then
            git tag "@filigran/rich-text-editor-v$FILIGRAN_RTE_VERSION"
            echo "Created tag: @filigran/rich-text-editor-v$FILIGRAN_RTE_VERSION"
          fi
          if [ -n "$FILIGRAN_UI_VERSION" ]; then
            git tag "@filigran/ui-v$FILIGRAN_UI_VERSION"
            echo "Created tag: @filigran/ui-v$FILIGRAN_UI_VERSION"
          fi
          git push --tags
      - name: Build packages
        run: |
          if [ -n "$FILIGRAN_CHATBOT_VERSION" ]; then
            echo "Building @filigran/chatbot..."
            yarn workspace @filigran/chatbot run build
          fi
          if [ -n "$FILIGRAN_ICON_VERSION" ]; then
            echo "Building @filigran/icon..."
            yarn workspace @filigran/icon run build
          fi
          if [ -n "$FILIGRAN_RTE_VERSION" ]; then
            echo "Building @filigran/rich-text-editor..."
            yarn workspace @filigran/rich-text-editor run build
          fi
          if [ -n "$FILIGRAN_UI_VERSION" ]; then
            echo "Building @filigran/ui..."
            yarn workspace @filigran/ui run build
          fi
      - name: Publish @filigran/chatbot to NPM
        if: (github.event.inputs.package == '@filigran/chatbot' || github.event.inputs.package == 'all') && env.FILIGRAN_CHATBOT_VERSION != ''
        working-directory: ./packages/filigran-chatbot
        run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @filigran/icon to NPM
        if: (github.event.inputs.package == '@filigran/icon' || github.event.inputs.package == 'all') && env.FILIGRAN_ICON_VERSION != ''
        working-directory: ./packages/filigran-icon
        run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @filigran/rich-text-editor to NPM
        if: (github.event.inputs.package == '@filigran/rich-text-editor' || github.event.inputs.package == 'all') && env.FILIGRAN_RTE_VERSION != ''
        working-directory: ./packages/filigran-rich-text-editor
        run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @filigran/ui to NPM
        if: (github.event.inputs.package == '@filigran/ui' || github.event.inputs.package == 'all') && env.FILIGRAN_UI_VERSION != ''
        working-directory: ./packages/filigran-ui
        run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release for @filigran/icon
        if: (github.event.inputs.package == '@filigran/icon' || github.event.inputs.package == 'all') && env.FILIGRAN_ICON_VERSION != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: '@filigran/icon-v${{ env.FILIGRAN_ICON_VERSION }}'
          name: 'Filigran Icon v${{ env.FILIGRAN_ICON_VERSION }}'
          body: |
            ## Filigran Icon v${{ env.FILIGRAN_ICON_VERSION }}
            
            ### Installation
            ```bash
            npm install @filigran/icon@${{ env.FILIGRAN_ICON_VERSION }}
            # or
            yarn add @filigran/icon@${{ env.FILIGRAN_ICON_VERSION }}
            ```
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Issues Closed
            ${{ steps.changelog.outputs.icon_issues }}
          draft: false
          prerelease: false
      - name: Create GitHub Release for @filigran/rich-text-editor
        if: (github.event.inputs.package == '@filigran/rich-text-editor' || github.event.inputs.package == 'all') && env.FILIGRAN_RTE_VERSION != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: '@filigran/rich-text-editor-v${{ env.FILIGRAN_RTE_VERSION }}'
          name: 'Filigran Rich Text Editor v${{ env.FILIGRAN_RTE_VERSION }}'
          body: |
            ## Filigran Rich Text Editor v${{ env.FILIGRAN_RTE_VERSION }}
            
            ### Installation
            ```bash
            yarn add @filigran/rich-text-editor@${{ env.FILIGRAN_RTE_VERSION }}
            ```
          draft: false
          prerelease: false
      - name: Create GitHub Release for @filigran/ui
        if: (github.event.inputs.package == '@filigran/ui' || github.event.inputs.package == 'all') && env.FILIGRAN_UI_VERSION != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: '@filigran/ui-v${{ env.FILIGRAN_UI_VERSION }}'
          name: 'Filigran UI v${{ env.FILIGRAN_UI_VERSION }}'
          body: |
            ## Filigran UI v${{ env.FILIGRAN_UI_VERSION }}
            
            ### Installation
            ```bash
            npm install @filigran/ui@${{ env.FILIGRAN_UI_VERSION }}
            # or
            yarn add @filigran/ui@${{ env.FILIGRAN_UI_VERSION }}
            ```
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Issues Closed
            ${{ steps.changelog.outputs.ui_issues }}
          draft: false
          prerelease: false
      - name: Create GitHub Release for @filigran/chatbot
        if: (github.event.inputs.package == '@filigran/chatbot' || github.event.inputs.package == 'all') && env.FILIGRAN_CHATBOT_VERSION != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: '@filigran/chatbot-v${{ env.FILIGRAN_CHATBOT_VERSION }}'
          name: 'Filigran Chatbot v${{ env.FILIGRAN_CHATBOT_VERSION }}'
          body: |
            ## Filigran Chatbot v${{ env.FILIGRAN_CHATBOT_VERSION }}
            
            ### Installation
            ```bash
            yarn add @filigran/chatbot@${{ env.FILIGRAN_CHATBOT_VERSION }}
            ```
          draft: false
          prerelease: false
      - name: Update project status
        if: (env.FILIGRAN_UI_VERSION != '' && steps.changelog.outputs.ui_issues != '') || (env.FILIGRAN_ICON_VERSION != '' && steps.changelog.outputs.icon_issues != '')
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const uiIssues = '${{ steps.changelog.outputs.ui_issues }}'.trim().split(' ').filter(Boolean);
            const iconIssues = '${{ steps.changelog.outputs.icon_issues }}'.trim().split(' ').filter(Boolean);
            const uiVersion = '${{ env.FILIGRAN_UI_VERSION }}';
            const iconVersion = '${{ env.FILIGRAN_ICON_VERSION }}';
            
            // Combine all issues
            const allIssues = [...new Set([...uiIssues, ...iconIssues])];
            
            if (allIssues.length === 0) {
              console.log('No issues to process');
              return;
            }
            
            // First part: Get project field IDs
            const projectFieldsQuery = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 40) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                          dataType
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          dataType
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const projectData = await github.graphql(projectFieldsQuery, {
              org: '${{ env.ORGANIZATION }}',
              number: parseInt('${{ env.PROJECT_NUMBER }}')
            });
            
            const projectId = projectData.organization.projectV2.id;
            let versionFieldId = null;
            let statusFieldId = null;
            let doneOptionId = null;
            
            // Find Version field, Status field, and Done option
            for (const field of projectData.organization.projectV2.fields.nodes) {
              if (field.name?.toLowerCase().includes('version')) {
                versionFieldId = field.id;
                console.log(`✓ Found Version field: ${field.id}`);
              }
            
              if (field.name === 'Status' && field.options) {
                statusFieldId = field.id;
                console.log(`✓ Found Status field: ${field.id}`);
            
                const doneOption = field.options.find(opt => 
                  opt.name.toLowerCase() === 'done'
                );
                if (doneOption) {
                  doneOptionId = doneOption.id;
                  console.log(`✓ Found Done option: ${doneOption.id}`);
                }
              }
            }
            
            if (!versionFieldId || !statusFieldId || !doneOptionId) {
              console.error('Missing required fields:', {
                versionFieldId,
                statusFieldId,
                doneOptionId
              });
            }
            
            const getProjectItemQuery = `
              query($owner: String!, $repo: String!, $issue: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          number
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const updateFieldMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: $value
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;
            
            // Process each issue
            for (const issue of allIssues) {
              if (!issue) continue;
            
              try {
                const issueNumber = parseInt(issue);
            
                // Determine which version to use
                let version = '';
                if (uiIssues.includes(issue) && uiVersion) {
                  version = uiVersion;
                } else if (iconIssues.includes(issue) && iconVersion) {
                  version = iconVersion;
                }
            
                // Get project items for this issue
                const itemData = await github.graphql(getProjectItemQuery, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue: issueNumber
                });
            
                const projectItems = itemData.repository.issue.projectItems.nodes;
            
                // Update each project item that belongs to our project
                for (const item of projectItems) {
                  if (item.project.number === parseInt('${{ env.PROJECT_NUMBER }}')) {
                    console.log(`Updating project item ${item.id} for issue #${issue}`);
            
                    // Update Status to Done
                    if (statusFieldId && doneOptionId) {
                      try {
                        await github.graphql(updateFieldMutation, {
                          projectId: projectId,
                          itemId: item.id,
                          fieldId: statusFieldId,
                          value: { singleSelectOptionId: doneOptionId }
                        });
                        console.log(`✓ Updated status to Done`);
                      } catch (error) {
                        console.error(`Failed to update status: ${error.message}`);
                      }
                    }
            
                    // Update Version field
                    if (versionFieldId && version) {
                      try {
                        await github.graphql(updateFieldMutation, {
                          projectId: projectId,
                          itemId: item.id,
                          fieldId: versionFieldId,
                          value: { text: `v${version}` }
                        });
                        console.log(`✓ Updated version to v${version}`);
                      } catch (error) {
                        console.error(`Failed to update version: ${error.message}`);
                      }
                    }
                  }
                }
            
                console.log(`✓ Updated project fields for issue #${issue}`);
            
              } catch (error) {
                console.error(`Failed to process issue #${issue}: ${error.message}`);
              }
            }
      - name: Close issues and add comments
        if: (env.FILIGRAN_UI_VERSION != '' && steps.changelog.outputs.ui_issues != '') || (env.FILIGRAN_ICON_VERSION != '' && steps.changelog.outputs.icon_issues != '')
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const uiIssues = '${{ steps.changelog.outputs.ui_issues }}'.trim().split(' ').filter(Boolean);
            const iconIssues = '${{ steps.changelog.outputs.icon_issues }}'.trim().split(' ').filter(Boolean);
            const uiVersion = '${{ env.FILIGRAN_UI_VERSION }}';
            const iconVersion = '${{ env.FILIGRAN_ICON_VERSION }}';
            
            // Process UI issues
            for (const issue of uiIssues) {
              if (!issue) continue;
              try {
                const issueNumber = parseInt(issue);
                const releaseMessage = `🎉 This issue has been resolved and released in @filigran/ui v${uiVersion}`;
            
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: releaseMessage
                });
            
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
            
                console.log(`✓ Closed UI issue #${issue} and added release comment`);
              } catch (error) {
                console.error(`Failed to close UI issue #${issue}: ${error.message}`);
              }
            }
            
            // Process Icon issues
            for (const issue of iconIssues) {
              if (!issue || uiIssues.includes(issue)) continue; // Skip duplicates
              try {
                const issueNumber = parseInt(issue);
                const releaseMessage = `🎉 This issue has been resolved and released in @filigran/icon v${iconVersion}`;
            
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: releaseMessage
                });
            
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
            
                console.log(`✓ Closed Icon issue #${issue} and added release comment`);
              } catch (error) {
                console.error(`Failed to close Icon issue #${issue}: ${error.message}`);
              }
            }
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$FILIGRAN_UI_VERSION" ]; then
            echo "✅ **Filigran UI** released: v$FILIGRAN_UI_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$FILIGRAN_ICON_VERSION" ]; then
            echo "✅ **Filigran Icon** released: v$FILIGRAN_ICON_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$UI_ISSUES_TO_CLOSE" ] && [ -n "$FILIGRAN_UI_VERSION" ]; then
            echo "### Closed Issues (@filigran/ui)" >> $GITHUB_STEP_SUMMARY
            for issue in $UI_ISSUES_TO_CLOSE; do
              echo "- #$issue" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -n "$ICON_ISSUES_TO_CLOSE" ] && [ -n "$FILIGRAN_ICON_VERSION" ]; then
            echo "### Closed Issues (@filigran/icon)" >> $GITHUB_STEP_SUMMARY
            for issue in $ICON_ISSUES_TO_CLOSE; do
              echo "- #$issue" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Check the [NPM Registry](https://www.npmjs.com/org/filigran) for published packages" >> $GITHUB_STEP_SUMMARY
          echo "- View the created [GitHub Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
